services:

  redis:
    image: redis:7-alpine
    container_name: qt_homolog_redis
    restart: always

    networks:
      - qt-network

  backend:
    build: ./backend
    container_name: qt_homolog_backend
    restart: always

    extra_hosts:
      - "host.docker.internal:host-gateway"

    entrypoint: ["sh", "./entrypoint.sh"]

    command:
      [
        "daphne",
        "-b",
        "0.0.0.0",
        "-p",
        "8000",
        "--application-close-timeout",
        "60",
        "core.asgi:application"
      ]

    env_file:
      - ./backend/.env

    environment:
      - RUN_SETUP=true

    volumes:
      - ./backend:/transportadora_backend
      - media_data:/transportadora_backend/media

    depends_on:
      - redis

    ports:
      - "8001:8000"

    networks:
      - qt-network

  celery_worker:
    build: ./backend
    container_name: qt_homolog_celery_worker
    restart: always

    extra_hosts:
      - "host.docker.internal:host-gateway"

    entrypoint: ["sh", "./entrypoint.sh"]

    command:
      [
        "celery",
        "-A",
        "core",
        "worker",
        "-l",
        "info"
      ]

    env_file:
      - ./backend/.env

    volumes:
      - ./backend:/transportadora_backend
      - media_data:/transportadora_backend/media

    depends_on:
      - redis

    networks:
      - qt-network

  celery_beat:
    build: ./backend
    container_name: qt_homolog_celery_beat
    restart: always

    extra_hosts:
      - "host.docker.internal:host-gateway"

    entrypoint: ["sh", "./entrypoint.sh"]

    command:
      [
        "celery",
        "-A",
        "core",
        "beat",
        "-l",
        "info",
        "--scheduler",
        "django_celery_beat.schedulers.DatabaseScheduler"
      ]

    env_file:
      - ./backend/.env

    volumes:
      - ./backend:/transportadora_backend

    depends_on:
      - redis

    networks:
      - qt-network

  celery_worker_ai:
    build: ./backend
    container_name: qt_homolog_celery_ai
    restart: always

    extra_hosts:
      - "host.docker.internal:host-gateway"

    entrypoint: ["sh", "./entrypoint.sh"]

    command:
      [
        "celery",
        "-A",
        "core",
        "worker",
        "-l",
        "info",
        "-Q",
        "ai_queue",
        "--pool=solo",
        "--concurrency=1"
      ]

    env_file:
      - ./backend/.env

    environment:
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - VECLIB_MAXIMUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1

    volumes:
      - ./backend:/transportadora_backend
      - media_data:/transportadora_backend/media

    depends_on:
      - redis

    networks:
      - qt-network

  portainer:
    image: portainer/portainer-ce:latest
    container_name: qt_homolog_portainer
    restart: always

    ports:
      - "127.0.0.1:9000:9000"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

    command: --admin-password '$$2b$$10$$dNxs1ay/04kVqPd8fPAEIuJ7KbI0c6x3rnRQmHKR4mJliTwtLwBQy'

    networks:
      - qt-network

networks:
  qt-network:

volumes:
  media_data:
  portainer_data:
