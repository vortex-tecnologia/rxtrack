services:

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ##0Bg1mt2fs3##
      MYSQL_DATABASE: quicktrack
      MYSQL_USER: quicktrack
      MYSQL_PASSWORD: quicktrack123
    volumes:
      - db_data:/var/lib/mysql
    ports:
    - "127.0.0.1:3307:3306"


    networks:
      - qt-network

  backend:
    build: ./backend
    restart: always
    env_file:
      - .env
    volumes:
      - ./media:/media
    depends_on:
      - db
    networks:
      - qt-network

  nginx:
    image: nginx:latest
    restart: always
    ports:
      - "8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./frontend:/usr/share/nginx/html
      - ./media:/media
    depends_on:
      - backend
    networks:
      - qt-network

networks:
  qt-network:

volumes:
  db_data:
