{% load static %}
{% load pwa %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <script src="/capacitor.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Acesso ao Sistema | RXTrack</title>
    <link rel="icon" href="{% static 'images/favicon.ico' %}" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    {% progressive_web_app_meta %}
    <meta name="theme-color" content="#0d6efd">
    <style>
        body { background: #f4f7f6; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 15px; }
        .login-card { width: 100%; max-width: 400px; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .header-box { background: #11111d; color: white; padding: 30px; text-align: center; }
        .body-box { background: white; padding: 30px; }
        .hidden { display: none; }
        .btn-primary { background: #0d6efd; border: none; padding: 12px; font-weight: 600; }
    </style>

</head>
<body>

<!-- Banner PWA (Escondido por Padrão) -->
<div id="pwa-install-banner" class="container mt-3 mb-3 hidden" style="max-width: 400px; padding: 0;">
    <div class="alert border-0 shadow-sm d-flex justify-content-between align-items-center" style="background-color: #f0f7ff; border-radius: 15px;">
        <div>
            <span class="fw-bold d-block text-primary"><i class="bi bi-phone-vibrate me-1"></i> Instale o App</span>
            <small class="text-muted">Acesse as rotas mais rápido!</small>
        </div>
        <button id="btn-instalar-app" class="btn btn-primary btn-sm px-3 fw-bold rounded-pill shadow-sm">
            Instalar
        </button>
    </div>
</div>

<div class="login-card">
    <div class="header-box">
        <i class="bi bi-truck fs-1"></i>
        <h4 class="mt-2 mb-0">QUICK DELIVERY</h4>
        <small class="opacity-75">Acesso ao Sistema</small>
    </div>
    
    <div class="body-box">
        <div id="alert-msg" class="alert alert-danger hidden"></div>

        <div id="step-cpf">
            <label class="form-label small fw-bold">DIGITE SEU CPF</label>
            <input type="text" id="input-cpf" class="form-control mb-3" placeholder="000.000.000-00">
            <button onclick="verificarCPF()" class="btn btn-primary w-100">Verificar Acesso</button>
            
        </div>

        <div id="step-login" class="hidden">
            <p class="small text-muted mb-3">Olá, <span id="user-name-login" class="fw-bold text-dark"></span>! Digite sua senha.</p>
            <input type="password" id="input-senha-login" class="form-control mb-3" placeholder="Sua senha">
            <button onclick="fazerLogin()" class="btn btn-primary w-100">Entrar no Sistema</button>
            <p class="mt-2 mb-2 small text-muted text-center">Bem vindo à plataforma</p>
        </div>

        <div id="step-cadastro" class="hidden">
            <p class="small text-success mb-3 fw-bold"><i class="bi bi-star"></i> Bem-vindo! Crie sua senha de acesso.</p>
            <input type="password" id="pass1" class="form-control mb-2" placeholder="Nova Senha">
            <input type="password" id="pass2" class="form-control mb-3" placeholder="Confirme a Senha">
            <button onclick="cadastrarSenha()" class="btn btn-success w-100 p-2 fw-bold">Cadastrar Senha</button>
            <p class="mt-2 mb-2 small text-muted text-center">Bem vindo à plataforma</p>
        </div>
    </div>
</div>

<script>
let globalCPF = "";
let globalTipo = "";

function showAlert(msg) {
    const box = document.getElementById('alert-msg');
    box.innerText = msg;
    box.classList.remove('hidden');
}

async function callAPI(body) {
    const response = await fetch("{% url 'operacional:login_operacional' %}", {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
        body: JSON.stringify(body)
    });
    return response;
}

async function verificarCPF() {
    globalCPF = document.getElementById('input-cpf').value;
    
    // Limpa pontuações
    globalCPF = globalCPF.replace(/\D/g, '');
    
    const res = await callAPI({ cpf: globalCPF, acao: 'verificar' });
    const data = await res.json();

    if (res.ok) {
        document.getElementById('step-cpf').classList.add('hidden');
        document.getElementById('alert-msg').classList.add('hidden');
        
        globalTipo = data.tipo;

        if (data.status === 'usuario_registrado') {
            document.getElementById('step-login').classList.remove('hidden');
            document.getElementById('user-name-login').innerText = data.nome;
        } else {
            document.getElementById('step-cadastro').classList.remove('hidden');
        }
    } else {
        showAlert(data.message);
    }
}

async function fazerLogin() {
    const senha = document.getElementById('input-senha-login').value;
    
    if (globalTipo === 'MOTORISTA' || globalTipo === 'SAC_MOBILE') {
        try {
            const res = await fetch(window.location.origin + '/api/auth/login/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: globalCPF, password: senha })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || data.erro || 'Senha inválida');
            
            localStorage.setItem('accessToken', data.access);
            localStorage.setItem('refreshToken', data.refresh);
            
            const meRes = await fetch(window.location.origin + '/api/auth/me/', {
                headers: { Authorization: `Bearer ${data.access}` }
            });
            if (meRes.ok) {
                const me = await meRes.json();
                localStorage.setItem('motorista_id', me.id);
            }
            if (window.syncToNativePreferences) {
                await window.syncToNativePreferences();
            }
            if (globalTipo === 'SAC_MOBILE') {
                window.location.href = '/app-sac/';
            } else {
                window.location.href = '/app/';
            }
        } catch (err) {
            showAlert(err.message);
        }
    } else {
        const res = await callAPI({ cpf: globalCPF, senha: senha, acao: 'login' });
        const data = await res.json();

        if (res.ok) window.location.href = data.url;
        else showAlert(data.message);
    }
}

async function cadastrarSenha() {
    const p1 = document.getElementById('pass1').value;
    const p2 = document.getElementById('pass2').value;

    if (p1 !== p2 || p1.length < 4) {
        showAlert("As senhas não conferem ou são muito curtas.");
        return;
    }

    if (globalTipo === 'MOTORISTA' || globalTipo === 'SAC_MOBILE') {
        try {
            const res = await fetch(window.location.origin + '/api/auth/primeiro-acesso/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cpf: globalCPF, senha: p1, confirmar_senha: p2 })
            });
            
            const data = await res.json();
            if (!res.ok) throw new Error(data.erro || data.detail || 'Erro ao criar usuário');
            
            localStorage.setItem('accessToken', data.access);
            localStorage.setItem('refreshToken', data.refresh);
            
            const meRes = await fetch(window.location.origin + '/api/auth/me/', {
                headers: { Authorization: `Bearer ${data.access}` }
            });
            if (meRes.ok) {
                const me = await meRes.json();
                localStorage.setItem('motorista_id', me.id);
            }
            if (window.syncToNativePreferences) {
                await window.syncToNativePreferences();
            }
            if (globalTipo === 'SAC_MOBILE') {
                window.location.href = '/app-sac/';
            } else {
                window.location.href = '/app/';
            }
        } catch (err) {
            showAlert(err.message);
        }
    } else {
        const res = await callAPI({ cpf: globalCPF, senha: p1, acao: 'cadastrar' });
        const data = await res.json();

        if (res.ok) window.location.href = data.url;
        else showAlert(data.message);
    }
}
</script>

<!-- Script para instalação do PWA -->
<script>
    let deferredPrompt;
    const installBanner = document.getElementById('pwa-install-banner');
    const installBtn = document.getElementById('btn-instalar-app');

    // Detecta se já está rodando como App instalado
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone || document.referrer.includes('android-app://');
    
    // Detecta se é celular/mobile
    const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

    if (!isStandalone && isMobile) {
        window.addEventListener('beforeinstallprompt', (e) => {
            // Previne o Chrome de exibir a barra nativa imediatamente
            e.preventDefault();
            deferredPrompt = e;
            // Exibe o nosso banner bonitinho
            installBanner.classList.remove('hidden');
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log(`Escolha do usuário: ${outcome}`);
                installBanner.classList.add('hidden');
                deferredPrompt = null;
            }
        });

        window.addEventListener('appinstalled', () => {
            installBanner.classList.add('hidden');
            deferredPrompt = null;
            console.log('PWA instalado com sucesso!');
        });
        
        // Para que o prompt apareça, precisamos registrar o Service Worker mesmo na tela de login
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/serviceworker.js', { scope: '/app/' })
            .then(() => console.log("PWA: Service Worker registrado para fins de instalação!"))
            .catch((err) => console.log("PWA: Falha ao registrar", err));
        }
    }
</script>
</body>
</html>
