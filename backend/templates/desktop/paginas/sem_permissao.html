{% extends "desktop/base.html" %}

{% block title %}Acesso Restrito - RXTrack{% endblock %}

{% block content %}
<div class="container-fluid py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card border-0 shadow-sm p-5 rounded-4">
                <div class="mb-4 text-warning">
                    <i class="bi bi-shield-lock-fill" style="font-size: 4rem;"></i>
                </div>
                <h3 class="fw-bold mb-2">Acesso Restrito</h3>
                <p class="text-muted mb-4">{{ mensagem|default:"Você não tem permissão para acessar este módulo. Entre em contato com o administrador do sistema." }}</p>
                <div>
                    <a href="/dashboard/" class="btn btn-primary rounded-pill px-4">
                        <i class="bi bi-arrow-left me-1"></i> Voltar ao Dashboard
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
