server {
    listen 80;
    server_name painel.rxtrack.com.br;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name painel.rxtrack.com.br;

    ssl_certificate /etc/letsencrypt/live/painel.rxtrack.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/painel.rxtrack.com.br/privkey.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8011;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_intercept_errors on;

        error_page 502 503 504 = /offline.html;
    }

    location = /offline.html {
        root /var/www/homolog-index;
        internal;
    }
}
